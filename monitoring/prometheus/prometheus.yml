global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "ciso-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-service:8000"]

  - job_name: "cadvisor"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "cadvisor:8080"

  - job_name: "nginx-log"
    scrape_interval: 15s
    static_configs:
      - targets: ["nginx-log-exporter:4040"]

  - job_name: "ciso-production"
    scrape_interval: 15s
    static_configs:
      - targets: ["production-metrics:9108"]