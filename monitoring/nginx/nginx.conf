
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format upstream_log
        '$remote_addr "$request" '
        'status=$status '
        'upstream=$upstream_addr '
        'upstream_time=$upstream_response_time '
        'request_time=$request_time';

    log_format prometheus_log
        '$remote_addr "$request" $status $body_bytes_sent '
        '$request_time $upstream_response_time $upstream_addr';

    access_log /var/log/nginx/metrics/access.log prometheus_log;

    access_log /dev/stdout upstream_log;
    error_log /dev/stderr warn;

    upstream mlflow_replicas {
        zone mlflow_replicas 64k;

        server model-serving:8080 resolve;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://mlflow_replicas;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }


}
