name: ciso-forecasting

services:
  mlflow-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/db/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - "mlflow-server:5000,localhost:*,127.0.0.1:*"
      - --workers
      - "1"
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow-db:/mlflow/db
      - mlflow-artifacts:/mlflow/artifacts
    networks:
      - ciso-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  api-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env.compose
    environment:
      MLFLOW_TRACKING_URI: "http://mlflow-server:5000"
      SOURCE_MLFLOW_URI: "https://dagshub.com/arsyad429/MLOps-Electricity-Demand-Forecasting.mlflow"
      SOURCE_MODEL_URI: "models:/CISO-Demand-Forecaster-CI@staging"
      LOCAL_MODEL_NAME: "CISO-Demand-Forecaster-Compose"
    command:
      - sh
      - -c
      - "python -m backend.bootstrap_model && exec uvicorn backend.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mlflow-server:
        condition: service_healthy
    networks:
      - ciso-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  inference-worker:
    profiles: [online]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      INFERENCE_API_URL: "http://api-service:8000"
      INFERENCE_RUN_MINUTE_UTC: "${INFERENCE_RUN_MINUTE_UTC:-15}"
      PREDICTION_DB_PATH: "/var/lib/ciso/predictions.sqlite3"
      EIA_SOURCE: "${EIA_SOURCE:-dashboard}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
      EIA_CONNECT_TIMEOUT: "${EIA_CONNECT_TIMEOUT:-5}"
      EIA_READ_TIMEOUT: "${EIA_READ_TIMEOUT:-12}"
      EIA_MAX_ATTEMPTS: "${EIA_MAX_ATTEMPTS:-3}"
    depends_on:
      api-service:
        condition: service_healthy
    volumes:
      - prediction-db:/var/lib/ciso
    networks:
      - ciso-network
    stop_grace_period: 2m
    restart: unless-stopped

  model-serving:
    image: ciso-mlflow-serving:lk10

    environment:
      MLFLOW_MODELS_WORKERS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"

    ports:
      - "127.0.0.1::8080"

    networks:
      - ciso-network

    deploy:
      replicas: 3

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping', timeout=5)"
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 60s

    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ciso-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - ciso-network
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - ciso-network
    restart: unless-stopped

  mlflow-lb:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./monitoring/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-request-logs:/var/log/nginx/metrics
    networks:
      - ciso-network
    depends_on:
      model-serving:
        condition: service_started
    restart: unless-stopped

  nginx-log-exporter:
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1
    command:
      - -config-file
      - /etc/nginxlog/exporter.hcl
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - ./monitoring/nginx/exporter.hcl:/etc/nginxlog/exporter.hcl:ro
      - nginx-request-logs:/var/log/nginx/metrics:ro
    networks:
      - ciso-network
    depends_on:
      - mlflow-lb
    restart: unless-stopped
  production-metrics:
    build:
      context: .
      dockerfile: docker/Dockerfile.production-metrics
    environment:
      PREDICTION_DB_PATH: /var/lib/ciso/predictions.sqlite3
      METRICS_PORT: "9108"
      DRIFT_MODEL_CHECK_URL: "${DRIFT_MODEL_CHECK_URL:-http://api-service:8000/mlflow-check}"
      DRIFT_WINDOW_HOURS: "${DRIFT_WINDOW_HOURS:-168}"
      DRIFT_MIN_PRODUCTION_SAMPLES: "${DRIFT_MIN_PRODUCTION_SAMPLES:-100}"
      DRIFT_MODERATE_THRESHOLD: "${DRIFT_MODERATE_THRESHOLD:-0.10}"
      DRIFT_SIGNIFICANT_THRESHOLD: "${DRIFT_SIGNIFICANT_THRESHOLD:-0.25}"
      DRIFT_REFRESH_SECONDS: "${DRIFT_REFRESH_SECONDS:-60}"
    ports:
      - "127.0.0.1:9108:9108"
    volumes:
      - prediction-db:/var/lib/ciso:ro
    networks:
      - ciso-network
    restart: unless-stopped


networks:
  ciso-network:
    driver: bridge

volumes:
  mlflow-db:
  mlflow-artifacts:
  prediction-db:
  prometheus-data:
  grafana-data:
  nginx-request-logs:
